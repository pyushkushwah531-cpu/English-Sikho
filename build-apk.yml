name: Build English Seekho Native APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Native Debug & Store Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Auto-organize Android folders if uploaded flat
        run: |
          if [ ! -f "app/src/main/AndroidManifest.xml" ] && [ -f "AndroidManifest.xml" ]; then
            echo "Organizing flat files into Android folders..."
            mkdir -p app/src/main/java/com/englishseekho/pro/data
            mkdir -p app/src/main/java/com/englishseekho/pro/services
            mkdir -p app/src/main/java/com/englishseekho/pro/notifications
            mkdir -p app/src/main/java/com/englishseekho/pro/widget
            mkdir -p app/src/main/java/com/englishseekho/pro/ui/theme
            mkdir -p app/src/main/java/com/englishseekho/pro/ui/screens
            mkdir -p app/src/main/res/values
            mkdir -p app/src/main/res/drawable
            mkdir -p app/src/main/res/mipmap-anydpi-v26
            mkdir -p app/src/main/res/layout
            mkdir -p app/src/main/res/xml

            mv AndroidManifest.xml app/src/main/
            [ -f proguard-rules.pro ] && mv proguard-rules.pro app/ || true
            mv Models.kt CurriculumRepository.kt LocalProgressStore.kt app/src/main/java/com/englishseekho/pro/data/
            mv SpeechCoach.kt app/src/main/java/com/englishseekho/pro/services/
            [ -f FeedbackManager.kt ] && mv FeedbackManager.kt app/src/main/java/com/englishseekho/pro/services/ || true
            [ -f NotificationHelper.kt ] && mv NotificationHelper.kt app/src/main/java/com/englishseekho/pro/notifications/ || true
            [ -f DailyReminderReceiver.kt ] && mv DailyReminderReceiver.kt app/src/main/java/com/englishseekho/pro/notifications/ || true
            mv WordOfDayWidgetProvider.kt app/src/main/java/com/englishseekho/pro/widget/
            mv Theme.kt app/src/main/java/com/englishseekho/pro/ui/theme/
            mv HomeAndPlanScreens.kt SpeakingStudioScreen.kt HindiBridgeAndGrammarScreen.kt VocabAndStoriesScreen.kt WritingCertificateSettingsScreen.kt app/src/main/java/com/englishseekho/pro/ui/screens/
            [ -f GameZoneScreen.kt ] && mv GameZoneScreen.kt app/src/main/java/com/englishseekho/pro/ui/screens/ || true
            mv MainActivity.kt app/src/main/java/com/englishseekho/pro/

            mv strings.xml colors.xml themes.xml app/src/main/res/values/
            mv ic_launcher_foreground.xml ic_launcher_background.xml app/src/main/res/drawable/
            [ -f ic_app_logo_unified.xml ] && mv ic_app_logo_unified.xml app/src/main/res/drawable/ || true
            [ -f ic_notification_logo.xml ] && mv ic_notification_logo.xml app/src/main/res/drawable/ || true
            mv ic_launcher.xml ic_launcher_round.xml app/src/main/res/mipmap-anydpi-v26/
            mv widget_word_of_day.xml app/src/main/res/layout/
            mv word_widget_info.xml app/src/main/res/xml/
            [ -f file_paths.xml ] && mv file_paths.xml app/src/main/res/xml/ || true

            printf '%s\n' \
              'plugins {' \
              '    id("com.android.application") version "8.5.2" apply false' \
              '    id("org.jetbrains.kotlin.android") version "1.9.24" apply false' \
              '}' > build.gradle.kts

            printf '%s\n' \
              'plugins {' \
              '    id("com.android.application")' \
              '    id("org.jetbrains.kotlin.android")' \
              '}' \
              'android {' \
              '    namespace = "com.englishseekho.pro"' \
              '    compileSdk = 34' \
              '    defaultConfig {' \
              '        applicationId = "com.englishseekho.pro"' \
              '        minSdk = 26' \
              '        targetSdk = 34' \
              '        versionCode = 6' \
              '        versionName = "1.3.2"' \
              '        vectorDrawables { useSupportLibrary = true }' \
              '    }' \
              '    signingConfigs {' \
              '        create("release") {' \
              '            val keystorePath = System.getenv("KEYSTORE_FILE")' \
              '            if (!keystorePath.isNullOrBlank() && file(keystorePath).exists()) {' \
              '                storeFile = file(keystorePath)' \
              '                storePassword = System.getenv("KEYSTORE_PASSWORD") ?: ""' \
              '                keyAlias = System.getenv("KEY_ALIAS") ?: ""' \
              '                keyPassword = System.getenv("KEY_PASSWORD") ?: ""' \
              '            }' \
              '        }' \
              '    }' \
              '    buildTypes {' \
              '        release {' \
              '            isMinifyEnabled = true' \
              '            isShrinkResources = true' \
              '            val releaseConfig = signingConfigs.findByName("release")' \
              '            if (releaseConfig?.storeFile != null) { signingConfig = releaseConfig }' \
              '            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")' \
              '        }' \
              '    }' \
              '    compileOptions {' \
              '        sourceCompatibility = JavaVersion.VERSION_17' \
              '        targetCompatibility = JavaVersion.VERSION_17' \
              '    }' \
              '    kotlinOptions { jvmTarget = "17" }' \
              '    buildFeatures { compose = true }' \
              '    composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }' \
              '    packaging { resources { excludes += "/META-INF/{AL2.0,LGPL2.1}" } }' \
              '}' \
              'dependencies {' \
              '    implementation("androidx.core:core-ktx:1.13.1")' \
              '    implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.3")' \
              '    implementation("androidx.activity:activity-compose:1.9.0")' \
              '    implementation(platform("androidx.compose:compose-bom:2024.06.00"))' \
              '    implementation("androidx.compose.ui:ui")' \
              '    implementation("androidx.compose.ui:ui-graphics")' \
              '    implementation("androidx.compose.ui:ui-tooling-preview")' \
              '    implementation("androidx.compose.material3:material3")' \
              '    implementation("androidx.compose.material:material-icons-extended")' \
              '    implementation("androidx.navigation:navigation-compose:2.7.7")' \
              '    debugImplementation("androidx.compose.ui:ui-tooling")' \
              '}' > app/build.gradle.kts
          fi

          # Also clean up any stray files uploaded directly to repo root even if app/ already exists
          if [ -d "app/src/main" ]; then
            mkdir -p app/src/main/java/com/englishseekho/pro/data \
                     app/src/main/java/com/englishseekho/pro/services \
                     app/src/main/java/com/englishseekho/pro/notifications \
                     app/src/main/java/com/englishseekho/pro/widget \
                     app/src/main/java/com/englishseekho/pro/ui/theme \
                     app/src/main/java/com/englishseekho/pro/ui/screens \
                     app/src/main/res/values app/src/main/res/drawable \
                     app/src/main/res/mipmap-anydpi-v26 app/src/main/res/layout app/src/main/res/xml

            [ -f "AndroidManifest.xml" ] && mv AndroidManifest.xml app/src/main/
            [ -f "proguard-rules.pro" ] && mv proguard-rules.pro app/
            for f in Models.kt CurriculumRepository.kt LocalProgressStore.kt; do
              [ -f "$f" ] && mv "$f" app/src/main/java/com/englishseekho/pro/data/
            done
            for f in SpeechCoach.kt FeedbackManager.kt; do
              [ -f "$f" ] && mv "$f" app/src/main/java/com/englishseekho/pro/services/
            done
            for f in NotificationHelper.kt DailyReminderReceiver.kt; do
              [ -f "$f" ] && mv "$f" app/src/main/java/com/englishseekho/pro/notifications/
            done
            [ -f "WordOfDayWidgetProvider.kt" ] && mv WordOfDayWidgetProvider.kt app/src/main/java/com/englishseekho/pro/widget/
            [ -f "Theme.kt" ] && mv Theme.kt app/src/main/java/com/englishseekho/pro/ui/theme/
            for f in HomeAndPlanScreens.kt SpeakingStudioScreen.kt HindiBridgeAndGrammarScreen.kt VocabAndStoriesScreen.kt WritingCertificateSettingsScreen.kt GameZoneScreen.kt; do
              [ -f "$f" ] && mv "$f" app/src/main/java/com/englishseekho/pro/ui/screens/
            done
            [ -f "MainActivity.kt" ] && mv MainActivity.kt app/src/main/java/com/englishseekho/pro/
            for f in strings.xml colors.xml themes.xml; do
              [ -f "$f" ] && mv "$f" app/src/main/res/values/
            done
            for f in ic_launcher_foreground.xml ic_launcher_background.xml ic_app_logo_unified.xml ic_notification_logo.xml; do
              [ -f "$f" ] && mv "$f" app/src/main/res/drawable/
            done
            for f in ic_launcher.xml ic_launcher_round.xml; do
              [ -f "$f" ] && mv "$f" app/src/main/res/mipmap-anydpi-v26/
            done
            [ -f "widget_word_of_day.xml" ] && mv widget_word_of_day.xml app/src/main/res/layout/
            for f in word_widget_info.xml file_paths.xml; do
              [ -f "$f" ] && mv "$f" app/src/main/res/xml/
            done

            # Repair root build.gradle.kts if app/build.gradle.kts was accidentally uploaded to repo root
            if [ -f "build.gradle.kts" ] && grep -q "com.englishseekho.pro" build.gradle.kts; then
              echo "Detected app/build.gradle.kts at repo root - moving to app/build.gradle.kts and restoring root build.gradle.kts..."
              mv build.gradle.kts app/build.gradle.kts
              printf '%s\n' \
                'plugins {' \
                '    id("com.android.application") version "8.5.2" apply false' \
                '    id("org.jetbrains.kotlin.android") version "1.9.24" apply false' \
                '}' > build.gradle.kts
            fi

            if [ ! -f "app/src/main/res/xml/file_paths.xml" ]; then
              printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<paths>' '    <cache-path name="certificates" path="certificates/" />' '</paths>' > app/src/main/res/xml/file_paths.xml
            fi

            if [ ! -f "app/src/main/res/drawable/ic_app_logo_unified.xml" ]; then
              printf '%s\n' \
                '<?xml version="1.0" encoding="utf-8"?>' \
                '<layer-list xmlns:android="http://schemas.android.com/apk/res/android">' \
                '    <item android:drawable="@drawable/ic_launcher_background" />' \
                '    <item android:drawable="@drawable/ic_launcher_foreground" />' \
                '</layer-list>' > app/src/main/res/drawable/ic_app_logo_unified.xml
            fi

            if [ ! -f "app/src/main/res/drawable/ic_notification_logo.xml" ]; then
              printf '%s\n' \
                '<vector xmlns:android="http://schemas.android.com/apk/res/android"' \
                '    android:width="24dp"' \
                '    android:height="24dp"' \
                '    android:viewportWidth="108"' \
                '    android:viewportHeight="108">' \
                '    <path android:fillColor="#00000000" android:pathData="M54,54m-42,0a42,42 0,1 1,84 0a42,42 0,1 1,-84 0" android:strokeWidth="5" android:strokeColor="#FFFFFF" />' \
                '    <path android:fillColor="#FFFFFF" android:pathData="M54,18 L57.2,27.5 L66.8,30.7 L57.2,33.9 L54,43.4 L50.8,33.9 L41.2,30.7 L50.8,27.5 Z" />' \
                '    <path android:fillColor="#FFFFFF" android:fillType="evenOdd" android:pathData="M52.5,45 C44,41.5 33,41.5 25,45 L25,74 C33,71 44,72.2 52.5,77 Z M33,68.5 L37.8,51 L41.5,51 L46.3,68.5 L42.9,68.5 L41.8,64.5 L37.5,64.5 L36.4,68.5 Z M38.2,61.5 L41.1,61.5 L39.65,55.2 Z" />' \
                '    <path android:fillColor="#FFFFFF" android:fillType="evenOdd" android:pathData="M55.5,45 C64,41.5 75,41.5 83,45 L83,74 C75,71 64,72.2 55.5,77 Z M61,51.5 h16 v4 h-16 z M61,58.5 h12.5 v4 h-12.5 z M61,65.5 h15 v4 h-15 z" />' \
                '    <path android:fillColor="#FFFFFF" android:pathData="M23,76.5 C32.5,79 44,80.5 54,85.5 C64,80.5 75.5,79 85,76.5 L85,81.5 C75.5,84 64,85.5 54,90.5 C44,85.5 32.5,84 23,81.5 Z" />' \
                '</vector>' > app/src/main/res/drawable/ic_notification_logo.xml
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses & Setup SDK 34
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Release Keystore (Secrets or Auto-Generated)
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '[:space:]' | base64 -d > release.jks
            echo "KEYSTORE_FILE=$PWD/release.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            keytool -genkeypair -v -keystore release.jks -alias englishseekho \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass Seekho@2026 -keypass Seekho@2026 \
              -dname "CN=English Seekho Pro, OU=Education, O=Hindi Medium Learners, L=India, S=IN, C=IN"
            echo "KEYSTORE_FILE=$PWD/release.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=Seekho@2026" >> $GITHUB_ENV
            echo "KEY_ALIAS=englishseekho" >> $GITHUB_ENV
            echo "KEY_PASSWORD=Seekho@2026" >> $GITHUB_ENV
          fi

      - name: Build Debug & Signed Release APKs
        run: gradle assembleDebug assembleRelease --no-daemon --console=plain

      - name: Upload Debug APK (Quick Test)
        uses: actions/upload-artifact@v4
        with:
          name: EnglishSeekhoPro-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Signed Release APK (Vivo & Indus Appstore)
        uses: actions/upload-artifact@v4
        with:
          name: EnglishSeekhoPro-Store-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
